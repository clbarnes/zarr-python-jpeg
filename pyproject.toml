[project]
name = "zarr-ext-jpeg"
version = "0.1.0"
description = "jpeg codec for zarr-python"
readme = "README.md"
authors = [{ name = "Chris Barnes", email = "chris.barnes@gerbi-gmb.de" }]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "zarr>=3.4.1",
]

[project.urls]
Documentation = "https://zarr-python-jpeg.readthedocs.io"
Repository = "https://github.com/clbarnes/zarr-python-jpeg"

[project.entry-points."zarr.codecs"]
jpeg = "zarr_ext_jpeg:JpegCodec"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "prek>=0.5.7",
    "rust-just>=1.59.0",
    "zarr-template>=0.1.1",
]
test = ["pytest>=9.1.1"]
lint = [
    "mypy>=2.4.0",
    "pydoclint>=0.12.0",
    "ruff>=0.17.1",
]
doc = [
    "pdoc>=16.0.0",
]
